name: SonarQube + Slack Pipeline

on:
  push:
    branches: [ "deploying" ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    # 🔹 Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 🔹 Setup Node.js
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # 🔹 Install dependencies
    - name: Install Dependencies
      run: npm install

    # 🔹 SonarQube Scan (no Maven)
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # 🔹 Quality Gate
    - name: Check Quality Gate
      id: qualitygate
      uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 🔴 Slack Failure
    - name: Slack Failure
      if: failure() || steps.qualitygate.outputs.quality_gate_status != 'PASSED'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"❌ Pipeline Failed - SonarQube Quality Gate failed"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    # 🟢 Slack Success
    - name: Slack Success
      if: success() && steps.qualitygate.outputs.quality_gate_status == 'PASSED'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"✅ Pipeline Successful - No vulnerabilities"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
