name: SonarQube Quality Gate Pipeline

on:
  push:
    branches: [ "deploying" ]

jobs:
  sonar-scan:
    runs-on: ubuntu-latest

    steps:
    # 🔹 Checkout code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 🔹 Setup Java
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 🔹 Build project
    - name: Build with Maven
      run: mvn clean install -DskipTests

    # 🔹 SonarQube Scan
    - name: SonarQube Scan
      run: |
        mvn sonar:sonar \
        -Dsonar.projectKey=hospital-management-system \
        -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
        -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # 🔹 Quality Gate Check
    - name: Check Quality Gate
      id: qualitygate
      uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 🔴 Slack Notification (Failure)
    - name: Notify Slack - Failure
      if: failure() || steps.qualitygate.outputs.quality_gate_status != 'PASSED'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "❌ Pipeline Failed: SonarQube Quality Gate failed for hospital-management-system. Please check vulnerabilities."
        }' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    # 🟢 Slack Notification (Success)
    - name: Notify Slack - Success
      if: success() && steps.qualitygate.outputs.quality_gate_status == 'PASSED'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "✅ Pipeline Successful: No critical vulnerabilities found in SonarQube."
        }' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
