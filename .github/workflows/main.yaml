name: SonarCloud + Slack Pipeline
on:
  push:
    branches: [ "deploying" ]
  pull_request:
    branches: [ "deploying" ]

jobs: 
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # ✅ Install Dependencies
    - name: Install Dependencies
      run: |
        cd backend
        npm install

    # ✅ SonarCloud Scan
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=Norahbiju_hospital-management-system
          -Dsonar.organization=norahbiju

    # 🟢 Slack Success Notification
    - name: Slack Success Notification
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "✅ SonarCloud Pipeline Successful",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*✅ SonarCloud Analysis Complete*\n\n*Project:* Hospital Management System\n*Branch:* deploying\n*Commit:* ${{ github.sha }}\n*Triggered by:* ${{ github.actor }}\n\n✨ Code quality analysis is ready"
              }
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View SonarCloud Dashboard"
                  },
                  "url": "https://sonarcloud.io/project/overview?id=Norahbiju_hospital-management-system"
                },
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View GitHub Run"
                  },
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
          ]
        }' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    # 🔴 Slack Failure Notification
    - name: Slack Failure Notification
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "❌ SonarCloud Pipeline Failed",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*❌ SonarCloud Analysis Failed*\n\n*Project:* Hospital Management System\n*Branch:* deploying\n*Commit:* ${{ github.sha }}\n*Triggered by:* ${{ github.actor }}\n\n⚠️ Check the logs for details"
              }
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View GitHub Run"
                  },
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
          ]
        }' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
