name: SonarQube + Slack Pipeline
on:
  push:
    branches: [ "deploying" ]

jobs: 
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # ✅ Install Dependencies
    - name: Install Dependencies
      run: |
        cd backend
        npm install

    # ✅ SonarQube Scan
    - name: SonarQube Scan
      run: |
        cd backend
        npx sonar-scanner \
        -Dsonar.projectKey=hospital \
        -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
        -Dsonar.login=${{ secrets.SONAR_TOKEN }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # ✅ Quality Gate Check (with proper timeout)
    - name: SonarQube Quality Gate
      id: qualitygate
      uses: SonarSource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      with:
        scanMetadataReportFile: backend/.scannerwork/report-task.txt
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # 🔴 Slack Failure Notification
    - name: Slack Failure Notification
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"❌ Pipeline Failed - SonarQube Quality Gate Check\n\nProject: hospital\nBranch: deploying\nCommit: ${{ github.sha }}"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    # 🟢 Slack Success Notification
    - name: Slack Success Notification
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"✅ Pipeline Successful - Quality Gate Passed\n\nProject: hospital\nBranch: deploying\nCommit: ${{ github.sha }}"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
