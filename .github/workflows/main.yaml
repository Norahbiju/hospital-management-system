name: SonarQube + Slack Pipeline

on:
  push:
    branches: [ "deploying" ]

jobs: 
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 🔍 Debug (DON'T REMOVE until fixed)
    - name: Debug Repo Structure
      run: |
        pwd
        ls -R

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # ✅ Install Dependencies
    - name: Install Dependencies
      run: |
        cd backend
        npm install

    # ✅ SonarQube Scan
    - name: SonarQube Scan
      run: |
        cd backend
        npx sonar-scanner \
        -Dsonar.projectKey=hospital \
        -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
        -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # ✅ Quality Gate
    - name: Check Quality Gate
      id: qualitygate
      uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 🔴 Slack Failure
    - name: Slack Failure
      if: failure() || steps.qualitygate.outputs.quality_gate_status != 'PASSED'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"❌ Pipeline Failed - SonarQube Quality Gate failed"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    # 🟢 Slack Success
    - name: Slack Success
      if: success() && steps.qualitygate.outputs.quality_gate_status == 'PASSED'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"✅ Pipeline Successful"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
