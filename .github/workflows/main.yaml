name: SonarCloud + Snyk + Slack Pipeline
on:
  push:
    branches: [ "deploying" ]
  pull_request:
    branches: [ "deploying" ]

jobs: 
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # ✅ Install Dependencies
    - name: Install Dependencies
      run: |
        cd backend
        npm install

    # ✅ SonarCloud Scan
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=hospital
          -Dsonar.organization=norahbiju

    # ✅ Snyk Security Scan
    - name: Run Snyk Security Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --sarif-file-output=snyk-docker.sarif
 
    - name: Upload result to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk-docker.sarif
      continue-on-error: true

    # 🟢 Slack Success Notification
    - name: Slack Success Notification
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "✅ Security & Code Quality Pipeline Successful",
          "blocks": [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "✅ All Scans Passed"
              }
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": "*Project:*\nHospital Management System"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Branch:*\ndeploying"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Commit:*\n${{ github.sha }}"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Triggered by:*\n${{ github.actor }}"
                }
              ]
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "✓ SonarCloud Code Quality Analysis Passed\n✓ Snyk Security Vulnerabilities Check Passed\n✓ Dependencies Scanned"
              }
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "SonarCloud Dashboard"
                  },
                  "url": "https://sonarcloud.io/project/overview?id=Norahbiju_hospital-management-system"
                },
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "GitHub Actions"
                  },
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
          ]
        }' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    # 🔴 Slack Failure Notification
    - name: Slack Failure Notification
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "❌ Security & Code Quality Pipeline Failed",
          "blocks": [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "❌ Pipeline Failed"
              }
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": "*Project:*\nHospital Management System"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Branch:*\ndeploying"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Commit:*\n${{ github.sha }}"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Triggered by:*\n${{ github.actor }}"
                }
              ]
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "⚠️ One or more scans failed:\n• SonarCloud Code Quality\n• Snyk Security Vulnerabilities\n• Dependency Check"
              }
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View Details"
                  },
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
          ]
        }' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
